<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Axiom AI — Matematik yordamchi</title>
<meta name="theme-color" content="#1b1d33" id="tema-rang">
<meta name="description" content="Oflayn matematik yordamchi">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Axiom AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  color-scheme: dark;
  --bg-top: #1b1d33; --bg-bottom: #2e2446; --panel: #2a2a3d; --text: #cdd6f4;
  --user: #3a4f8a; --axiom: #34365c; --kok: #89b4fa; --yashil: #a6e3a1; --sariq: #f9e2af;
  --pembe: #f5c2e7; --qizil: #f38ba8; --firoza: #94e2d5; --toq: #45475a; --toq-hover: #585b70;
  --gray: #9399b2; --plot-bg: #171827; --plot-grid: #2c2f4a; --plot-axis: #9399b2;
  --fs: 16px;
  --mono: ui-monospace, "SF Mono", Consolas, Menlo, "Roboto Mono", monospace;
}
:root[data-tema="light"] {
  color-scheme: light;
  --bg-top: #e8ecf6; --bg-bottom: #d6dcee; --panel: #e1e5ee; --text: #2e3350;
  --user: #c4d6fb; --axiom: #fafbfe; --kok: #1e66f5; --yashil: #2f8f2f; --sariq: #9a5b00;
  --pembe: #a8328f; --qizil: #d20f39; --firoza: #0f8a8a; --toq: #c5cad8; --toq-hover: #b2b8ca;
  --gray: #5c6078; --plot-bg: #ffffff; --plot-grid: #dde1ee; --plot-axis: #5c6078;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed; top: 0; left: 0; right: 0; height: var(--vh, 100dvh); margin: 0; overflow: hidden;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-top: env(safe-area-inset-top, 0px); overscroll-behavior: none;
}
header { display: flex; align-items: center; gap: 6px; padding: 8px 10px 6px; }
header .nom { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-weight: 700; font-size: 17px; color: var(--kok); white-space: nowrap; overflow: hidden; }
header .nom img { width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto; }
.ik, .tugma {
  border: 0; border-radius: 10px; background: var(--toq); color: var(--text); font: 700 14px system-ui, sans-serif; cursor: pointer;
}
.ik { width: 40px; height: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.ik svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tugma { min-width: 40px; height: 40px; padding: 0 14px; }
.ik:active, .tugma:active { background: var(--toq-hover); }
.ik.faol, .tugma.faol { background: var(--kok); color: #fff; }
@media (max-width: 349px) { header .nom span { display: none; } }
body.klav header { padding-top: 4px; padding-bottom: 2px; }
body.klav header .nom span { display: none; }
#chat { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 6px 0 10px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.pufak {
  max-width: 90%; margin: 5px 10px; padding: 9px 13px 10px; border-radius: 14px; font-size: var(--fs);
  line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text;
}
.pufak .kim { display: block; font-size: 0.82em; font-weight: 700; margin-bottom: 2px; }
.siz { align-self: flex-end; background: var(--user); }
.siz .kim { color: var(--kok); }
.axiom { align-self: flex-start; background: var(--axiom); }
.axiom .kim { color: var(--yashil); }
.axiom.suhbat .matn { color: var(--pembe); }
.axiom.natija .matn { color: var(--sariq); font-family: var(--mono); font-size: 0.95em; }
.axiom.xato .matn { color: var(--qizil); }
.axiom.kutish .matn { color: var(--gray); font-style: italic; }
canvas.graf { display: block; margin-top: 8px; border-radius: 8px; max-width: 100%; }
#pastki { padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: rgba(0,0,0,0.12); }
body.klav #pastki { padding-bottom: 8px; }
#namunalar, #belgilar { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
#namunalar::-webkit-scrollbar, #belgilar::-webkit-scrollbar { display: none; }
#namunalar.yopiq, body.klav #namunalar { display: none; }
.chip { flex: 0 0 auto; border: 0; border-radius: 16px; padding: 7px 13px; font: 700 13px system-ui, sans-serif; color: #1e1e2e; cursor: pointer; }
.chip:active { filter: brightness(1.15); }
.belgi { flex: 0 0 auto; border: 0; border-radius: 8px; min-width: 40px; height: 36px; background: var(--toq); color: var(--text); font: 600 16px var(--mono); cursor: pointer; }
.belgi:active { background: var(--toq-hover); }
#qator { display: flex; gap: 8px; }
#kirish {
  flex: 1; min-width: 0; height: 46px; border: 0; border-radius: 12px; padding: 0 14px; font-size: 16px;
  background: var(--panel); color: var(--text); outline: none;
}
#yubor { border: 0; border-radius: 12px; height: 46px; padding: 0 18px; background: var(--yashil); color: #1e1e2e; font: 700 15px system-ui, sans-serif; cursor: pointer; }
:root[data-tema="light"] #yubor { color: #fff; }
#yubor:disabled { opacity: 0.5; }
/* yangilanish xabari va toast */
#yangi { display: none; align-items: center; gap: 8px; margin: 0 8px 6px; padding: 8px 10px 8px 14px; border-radius: 12px; background: var(--kok); color: #fff; font-size: 14px; font-weight: 600; }
#yangi.korinadi { display: flex; }
#yangi span { flex: 1; }
#yangi button { border: 0; border-radius: 8px; background: rgba(255,255,255,0.25); color: #fff; font: 700 13px system-ui, sans-serif; height: 32px; padding: 0 12px; cursor: pointer; }
#toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); max-width: 86%; z-index: 80; background: rgba(20,20,30,0.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
#toast.korinadi { opacity: 1; }
/* yuklanish oynasi */
#yuklash { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)); padding: 24px; text-align: center; }
#yuklash img { width: 96px; height: 96px; border-radius: 22px; }
#yuklash h1 { margin: 0; font-size: 30px; color: var(--kok); }
#yuklash .osti { color: var(--gray); font-size: 15px; }
.chiziq { width: min(320px, 80vw); height: 8px; background: var(--toq); border-radius: 4px; overflow: hidden; }
.chiziq i { display: block; height: 100%; width: 10%; background: var(--yashil); border-radius: 4px; transition: width 0.6s ease; }
#yuklash .holat { font-size: 15px; min-height: 1.4em; }
#yuklash .eslatma { color: var(--gray); font-size: 13px; max-width: 320px; line-height: 1.4; }
/* to'liq sahifa oynalari (Ma'lumot, Tarix) */
.sahifa { position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; background: var(--bg-top); padding-top: env(safe-area-inset-top, 0px); }
.sahifa.ochiq { display: flex; }
.sahifa .tepa { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; align-items: center; scrollbar-width: none; }
.sahifa .tepa::-webkit-scrollbar { display: none; }
.sahifa .tepa .oxir { margin-left: auto; flex: 0 0 auto; }
.sahifa .tab { flex: 0 0 auto; }
.sahifa .sarl { flex: 1; font-weight: 700; font-size: 17px; color: var(--kok); padding-left: 4px; }
.sahifa .ichki { flex: 1; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; overscroll-behavior: contain; }
.sahifa .b { color: var(--kok); font-weight: 700; }
.sahifa .k { color: var(--sariq); font-family: var(--mono); font-size: 14px; }
.tarix-el { display: block; width: 100%; text-align: left; border: 0; border-radius: 10px; background: var(--panel); color: var(--text); padding: 10px 13px; margin: 0 0 8px; cursor: pointer; font: inherit; }
.tarix-el:active { background: var(--toq); }
.tarix-el b { display: block; color: var(--kok); font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
.tarix-el span { display: block; color: var(--sariq); font-family: var(--mono); font-size: 13px; margin-top: 3px; overflow-wrap: anywhere; }
.bosh { color: var(--gray); padding: 12px 2px; }
#tarixIchki { white-space: normal; }
/* sozlamalar (pastdan chiqadigan oyna) */
.qatlam { position: fixed; inset: 0; z-index: 45; display: none; }
.qatlam.ochiq { display: block; }
.qatlam .fon { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
.varaq { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; background: var(--bg-top); border-radius: 20px 20px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 24px rgba(0,0,0,0.35); }
.varaq .tutqich { width: 44px; height: 5px; border-radius: 3px; background: var(--toq); margin: 0 auto 10px; }
.varaq h2 { margin: 0 0 8px; font-size: 18px; color: var(--kok); }
.bolim { margin: 14px 0; }
.bolim .sarlavha { font-size: 13px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
.qator2 { display: flex; gap: 8px; align-items: center; }
.qator2 .tugma { flex: 1; }
#sNamuna { flex: 2; text-align: center; font-family: var(--mono); font-size: var(--fs); padding: 6px 4px; border-radius: 10px; background: var(--panel); overflow: hidden; white-space: nowrap; }
.keng { display: block; width: 100%; margin-bottom: 8px; text-align: left; }
.xavf { background: transparent; color: var(--qizil); border: 1.5px solid var(--qizil); text-align: center; }
.xavf.tasdiq { background: var(--qizil); color: #fff; }
</style>
</head>
<body>
<div id="yuklash">
  <img src="icon-512.png" alt="Axiom AI">
  <h1>Axiom AI</h1>
  <div class="osti">Matematik yordamchi</div>
  <div class="chiziq"><i id="foiz"></i></div>
  <div class="holat" id="holat">Yuklanmoqda…</div>
  <div class="eslatma" id="eslatma">Birinchi ochilishda internet kerak (taxminan 30–40 MB yuklanadi). Keyingi safar internetsiz ham ishlaydi.</div>
  <button class="tugma" id="qayta" style="display:none">Qayta urinish</button>
</div>

<header>
  <div class="nom"><img src="icon-192.png" alt=""><span>Axiom AI</span></div>
  <button class="ik" id="tarix" aria-label="Tarix" title="Tarix"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
  <button class="ik" id="amalBtn" aria-label="Amallar" title="Amallar"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
  <button class="ik" id="sozBtn" aria-label="Sozlamalar" title="Sozlamalar"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  <button class="ik" id="info" aria-label="Ma'lumot" title="Ma'lumot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
</header>

<div id="chat" aria-live="polite"></div>

<div id="yangi"><span>Yangi versiya tayyor</span><button id="yangilaBtn">Yangilash</button><button id="yangiYop" aria-label="Yopish">✕</button></div>

<div id="pastki">
  <div id="namunalar"></div>
  <div id="belgilar"></div>
  <div id="qator">
    <input id="kirish" type="text" placeholder="Misolni yozing…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
    <button id="yubor">Yuborish</button>
  </div>
</div>

<div id="malumot" class="sahifa">
  <div class="tepa">
    <button class="ik orqaga" aria-label="Ortga"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="tugma tab faol" data-tab="qollanma">Qo'llanma</button>
    <button class="tugma tab" data-tab="imkoniyatlar">Imkoniyatlar</button>
    <button class="tugma tab" data-tab="haqida">Dastur haqida</button>
    <button class="tugma tab" data-tab="ornatish">O'rnatish</button>
  </div>
  <div class="ichki" id="ichki"></div>
</div>

<div id="tarixOyna" class="sahifa">
  <div class="tepa">
    <button class="ik orqaga" aria-label="Ortga"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="sarl">Yechilgan misollar</div>
    <button class="tugma oxir" id="tarixTozala">Tarixni tozalash</button>
  </div>
  <div class="ichki" id="tarixIchki"></div>
</div>

<div id="sozOyna" class="qatlam">
  <div class="fon" id="sozFon"></div>
  <div class="varaq">
    <div class="tutqich"></div>
    <h2>Sozlamalar</h2>
    <div class="bolim">
      <div class="sarlavha">Yozuv kattaligi</div>
      <div class="qator2">
        <button class="tugma" id="sKichik">A-</button>
        <div id="sNamuna">x² − 5x + 6 = 0</div>
        <button class="tugma" id="sKatta">A+</button>
      </div>
      <div class="qator2" style="margin-top:8px"><button class="tugma" id="sAsl">Asl holiga</button></div>
    </div>
    <div class="bolim">
      <div class="sarlavha">Mavzu</div>
      <div class="qator2">
        <button class="tugma" id="tYorug">Yorug'</button>
        <button class="tugma" id="tQorong">Qorong'u</button>
      </div>
    </div>
    <div class="bolim">
      <div class="sarlavha">Ilova</div>
      <button class="tugma keng" id="sOrnat">Ilovani o'rnatish</button>
      <button class="tugma keng" id="sUlash">Do'stlarga yuborish</button>
    </div>
    <div class="bolim">
      <button class="tugma keng xavf" id="sTozala">Chatni tozalash</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
// ---------- Sozlamalar ----------
const NAMUNALAR = [
  ["Tenglama", "x^2-5x+6=0", "#89b4fa"], ["Hosila", "hosila x^3+2x", "#a6e3a1"], ["Integral", "integral 2x", "#f9e2af"],
  ["Limit", "limit x->0 sin(x)/x", "#f5c2e7"], ["Matritsa", "det [[1,2],[3,4]]", "#94e2d5"], ["Tizim", "tizim: x+y=5, x-y=1", "#f38ba8"],
  ["Grafik", "grafik x^2", "#fab387"], ["Bosqich", "bosqich x^2-5x+6=0", "#cba6f7"], ["Ajrat", "ajrat x^2-5x+6", "#f2cdcd"],
  ["Qavs och", "och (x+2)^3", "#f5e0dc"], ["EKUB/EKUK", "ekub va ekuk 12 18", "#b5e8e0"], ["Kasr", "1/2 + 3/4", "#f9e2af"],
  ["Foiz", "200 ning 15%", "#a6e3a1"], ["Birlik", "5 km necha metr", "#89dceb"], ["Geometriya", "doira yuzi r=5", "#fab387"],
  ["Sanoq", "25 ikkilik", "#f5c2e7"]
];
const BELGILAR = ["^", "(", ")", "/", "*", "+", "-", "=", "x", "y", "%", ".", ",", ":", "[", "]", "<", ">", "sqrt(", "pi"];
const HISOBLASH_VAQTI = 30000;
const ASL_SHRIFT = 16;

const $ = (id) => document.getElementById(id);
const chat = $("chat"), kirish = $("kirish"), yubor = $("yubor");
let worker = null, tayyor = false, soNom = 0, qaytaIshga = false;
const kutayotgan = new Map();

function saqla(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function oqi(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

let toastTaymer = null;
function toast(matn) {
  const t = $("toast"); t.textContent = matn; t.classList.add("korinadi");
  clearTimeout(toastTaymer); toastTaymer = setTimeout(() => t.classList.remove("korinadi"), 3200);
}

// ---------- Chat pastiga surish ----------
function pastga() { chat.scrollTop = chat.scrollHeight; }
function pastgaKech() { pastga(); requestAnimationFrame(pastga); setTimeout(pastga, 120); setTimeout(pastga, 350); }

// ---------- Klaviatura: oyna balandligi klaviatura bilan birga o'zgaradi ----------
const vv = window.visualViewport;
let asosH = 0, asosW = 0, klavOchiq = false;
function oynaniMosla() {
  const h = vv ? vv.height : window.innerHeight, w = vv ? vv.width : window.innerWidth;
  if (Math.abs(w - asosW) > 40) { asosW = w; asosH = h; }
  if (h > asosH) asosH = h;
  const klav = asosH - h > 120;
  document.documentElement.style.setProperty("--vh", Math.round(h) + "px");
  document.body.style.top = (vv ? Math.round(vv.offsetTop) : 0) + "px";
  document.body.classList.toggle("klav", klav);
  if (klav !== klavOchiq) { klavOchiq = klav; pastgaKech(); }
}
if (vv) { vv.addEventListener("resize", oynaniMosla); vv.addEventListener("scroll", oynaniMosla); }
window.addEventListener("resize", oynaniMosla);
kirish.addEventListener("focus", () => { setTimeout(() => { window.scrollTo(0, 0); oynaniMosla(); pastgaKech(); }, 250); });
oynaniMosla();

// ---------- Mavzu va yozuv kattaligi ----------
function temaQo_y(t, saqlash) {
  if (t === "light") document.documentElement.setAttribute("data-tema", "light");
  else document.documentElement.removeAttribute("data-tema");
  $("tema-rang").setAttribute("content", t === "light" ? "#e8ecf6" : "#1b1d33");
  $("tYorug").classList.toggle("faol", t === "light");
  $("tQorong").classList.toggle("faol", t !== "light");
  if (saqlash !== false) saqla("axiom_tema", t);
  document.querySelectorAll("canvas.graf").forEach((c) => { if (c._g) grafikChiz(c, c._g); });
}
let shrift = parseInt(oqi("axiom_shrift") || String(ASL_SHRIFT), 10);
function shriftQo_y(v) {
  shrift = Math.max(12, Math.min(26, v));
  document.documentElement.style.setProperty("--fs", shrift + "px");
  saqla("axiom_shrift", String(shrift));
}
const saqlanganTema = oqi("axiom_tema");
const qurilmaYorug = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
temaQo_y(saqlanganTema ? (saqlanganTema === "light" ? "light" : "dark") : (qurilmaYorug ? "light" : "dark"), false);
shriftQo_y(shrift);
$("tYorug").onclick = () => temaQo_y("light");
$("tQorong").onclick = () => temaQo_y("dark");
$("sKichik").onclick = () => shriftQo_y(shrift - 2);
$("sKatta").onclick = () => shriftQo_y(shrift + 2);
$("sAsl").onclick = () => shriftQo_y(ASL_SHRIFT);

// ---------- Chat ----------
function xabarQo_sh(kim, matn, tur) {
  const d = document.createElement("div");
  d.className = "pufak " + (kim === "Siz" ? "siz" : "axiom " + (tur || "suhbat"));
  const k = document.createElement("span"); k.className = "kim"; k.textContent = kim;
  const m = document.createElement("span"); m.className = "matn"; m.textContent = matn;
  d.appendChild(k); d.appendChild(m);
  chat.appendChild(d); pastga();
  return d;
}

function grafikChiz(cnv, g) {
  const css = getComputedStyle(document.documentElement);
  const C = (n) => css.getPropertyValue(n).trim();
  const dpr = window.devicePixelRatio || 1, cw = cnv._cw, ch = cnv._ch;
  cnv.width = Math.round(cw * dpr); cnv.height = Math.round(ch * dpr);
  cnv.style.width = cw + "px"; cnv.style.height = ch + "px";
  const x = cnv.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const L = 44, R = 12, T = 10, B = 24, pw = cw - L - R, ph = ch - T - B;
  const px = (v) => L + (v - g.a) / (g.b - g.a) * pw;
  const py = (v) => T + (g.yuqori - v) / (g.yuqori - g.past) * ph;
  x.fillStyle = C("--plot-bg"); x.fillRect(L, T, pw, ph);
  x.font = "10px " + C("--mono"); x.fillStyle = C("--gray"); x.strokeStyle = C("--plot-grid"); x.lineWidth = 1;
  x.textAlign = "center"; x.textBaseline = "top";
  g.xt.forEach(([t, s]) => { x.beginPath(); x.moveTo(px(t), T); x.lineTo(px(t), T + ph); x.stroke(); x.fillText(s, px(t), T + ph + 5); });
  x.textAlign = "right"; x.textBaseline = "middle";
  g.yt.forEach(([t, s]) => { x.beginPath(); x.moveTo(L, py(t)); x.lineTo(L + pw, py(t)); x.stroke(); x.fillText(s, L - 5, py(t)); });
  x.strokeStyle = C("--plot-axis"); x.lineWidth = 2;
  if (g.a <= 0 && 0 <= g.b) { x.beginPath(); x.moveTo(px(0), T); x.lineTo(px(0), T + ph); x.stroke(); }
  if (g.past <= 0 && 0 <= g.yuqori) { x.beginPath(); x.moveTo(L, py(0)); x.lineTo(L + pw, py(0)); x.stroke(); }
  x.save(); x.beginPath(); x.rect(L, T, pw, ph); x.clip();
  const ranglar = [C("--sariq"), C("--firoza"), C("--pembe"), C("--yashil")];
  x.lineWidth = 2; x.lineCap = "round"; x.lineJoin = "round";
  g.chiziqlar.forEach((segmentlar, i) => {
    x.strokeStyle = ranglar[i % ranglar.length];
    segmentlar.forEach((s) => {
      x.beginPath();
      s.forEach((p, j) => { if (j === 0) x.moveTo(px(p[0]), py(p[1])); else x.lineTo(px(p[0]), py(p[1])); });
      x.stroke();
    });
  });
  x.restore();
  x.strokeStyle = C("--toq"); x.lineWidth = 1; x.strokeRect(L, T, pw, ph);
  x.font = "bold 11px " + C("--mono"); x.textAlign = "left"; x.textBaseline = "top";
  g.nomlar.forEach((n, i) => { x.fillStyle = ranglar[i % ranglar.length]; x.fillText(n, L + 8, T + 6 + i * 15); });
}

function grafikQo_sh(pufak, g) {
  const cnv = document.createElement("canvas");
  cnv.className = "graf";
  cnv._cw = Math.max(240, Math.min(560, chat.clientWidth - 56));
  cnv._ch = Math.round(cnv._cw * 0.62);
  cnv._g = g;
  pufak.appendChild(cnv);
  grafikChiz(cnv, g);
  pastgaKech();
}

function xabarlarniKo_rsat(xabarlar) {
  xabarlar.forEach((x) => {
    const chiqar = () => { const p = xabarQo_sh("Axiom", x.matn, x.tur); if (x.grafik) grafikQo_sh(p, x.grafik); };
    if (x.keyin) setTimeout(chiqar, 450); else chiqar();
  });
}

// ---------- Python bilan aloqa ----------
function hisobla(op, qiymatlar, vaqt) {
  return new Promise((resolve, reject) => {
    const id = ++soNom;
    const taymer = setTimeout(() => { kutayotgan.delete(id); reject(new Error("vaqt")); }, vaqt || HISOBLASH_VAQTI);
    kutayotgan.set(id, { resolve, reject, taymer });
    worker.postMessage(Object.assign({ op, id }, qiymatlar));
  });
}

function holatKo_rsat(matn, foiz) {
  if (matn) $("holat").textContent = matn;
  if (foiz) $("foiz").style.width = foiz + "%";
}

function ishchiniBoshla() {
  tayyor = false;
  yubor.disabled = true;
  if (worker) { try { worker.terminate(); } catch (e) {} }
  worker = new Worker("worker.js");
  worker.onmessage = (ev) => {
    const d = ev.data;
    if (d.tur === "holat") holatKo_rsat(d.matn, d.foiz);
    else if (d.tur === "tayyor") tayyorBo_ldi();
    else if (d.tur === "boshlash_xatosi") boshlashXatosi(d.matn);
    else if (d.tur === "javob") {
      const k = kutayotgan.get(d.id);
      if (!k) return;
      kutayotgan.delete(d.id); clearTimeout(k.taymer);
      if (d.hato) k.reject(new Error(d.hato)); else k.resolve(d.natija);
    }
  };
  worker.onerror = () => boshlashXatosi("Python fayllarini yuklab bo'lmadi");
}

function boshlashXatosi(matn) {
  $("yuklash").style.display = "flex";
  holatKo_rsat("Yuklab bo'lmadi: " + matn);
  $("eslatma").textContent = "Birinchi marta internetga ulanib oching: kerakli fayllar yuklab olinadi. Keyin internetsiz ishlaydi.";
  $("qayta").style.display = "inline-block";
}
$("qayta").onclick = () => location.reload();

async function tayyorBo_ldi() {
  tayyor = true; yubor.disabled = false;
  holatKo_rsat("Tayyor", 100);
  setTimeout(() => { $("yuklash").style.display = "none"; }, 250);
  if (qaytaIshga) {
    qaytaIshga = false;
    xabarQo_sh("Axiom", "Axiom yana tayyor. Davom etamiz!", "suhbat");
  } else if (!chat.children.length) {
    try { xabarQo_sh("Axiom", await hisobla("salom", { soat: new Date().getHours() }), "suhbat"); }
    catch (e) { xabarQo_sh("Axiom", "Salom! Qanday yordam bera olaman?", "suhbat"); }
  }
}

async function xabarYubor() {
  const matn = kirish.value.trim();
  if (!matn || !tayyor) return;
  kirish.value = "";
  xabarQo_sh("Siz", matn);
  yubor.disabled = true;
  const kutish = xabarQo_sh("Axiom", "Hisoblayapman…", "kutish");
  try {
    const natija = await hisobla("javob", { matn });
    kutish.remove();
    const xabarlar = JSON.parse(natija);
    xabarlarniKo_rsat(xabarlar);
    const asosiy = xabarlar.find((m) => m.tur === "natija" || m.grafik);
    if (asosiy) {
      const q = asosiy.grafik ? ["grafik chizildi"] : asosiy.matn.split("\n");
      tarixgaQo_sh(matn, q[q.length - 1].slice(0, 100));
    }
  } catch (e) {
    kutish.remove();
    if (e.message === "vaqt") {
      xabarQo_sh("Axiom", "Bu misol juda uzoq hisoblandi, to'xtatdim. Soddaroq ko'rinishda yozib ko'ring. Qayta ishga tushyapman…", "xato");
      qaytaIshga = true;
      ishchiniBoshla();
      return;
    }
    xabarQo_sh("Axiom", "Kechirasiz, bu misolni hisoblay olmadim.", "xato");
  }
  yubor.disabled = !tayyor;
  pastgaKech();
}

yubor.onclick = xabarYubor;
kirish.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); xabarYubor(); } });
yubor.addEventListener("pointerdown", (e) => e.preventDefault());  // klaviatura yopilib qolmasin

// ---------- Namunalar (Amallar) va belgilar paneli ----------
NAMUNALAR.forEach(([nom, namuna, rang]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = nom; b.style.background = rang;
  b.addEventListener("pointerdown", (e) => e.preventDefault());
  b.onclick = () => { kirish.value = namuna; kirish.focus(); };
  $("namunalar").appendChild(b);
});
BELGILAR.forEach((s) => {
  const b = document.createElement("button");
  b.className = "belgi"; b.textContent = s;
  b.addEventListener("pointerdown", (e) => e.preventDefault());
  b.onclick = () => {
    const a = kirish.selectionStart ?? kirish.value.length, z = kirish.selectionEnd ?? kirish.value.length;
    kirish.value = kirish.value.slice(0, a) + s + kirish.value.slice(z);
    const p = a + s.length; kirish.focus(); kirish.setSelectionRange(p, p);
  };
  $("belgilar").appendChild(b);
});
function amallarQo_y(och) {
  $("namunalar").classList.toggle("yopiq", !och);
  $("amalBtn").classList.toggle("faol", och);
  saqla("axiom_amallar", och ? "1" : "0");
  pastgaKech();
}
const saqlanganAmal = oqi("axiom_amallar");
amallarQo_y(saqlanganAmal === null ? true : saqlanganAmal === "1");
$("amalBtn").onclick = () => amallarQo_y($("namunalar").classList.contains("yopiq"));

// ---------- Oynalar: ochish va ortga (telefonning ortga tugmasi ham yopadi) ----------
let ochiqOyna = null;
function oynaOch(id) {
  if (ochiqOyna) $(ochiqOyna).classList.remove("ochiq");
  $(id).classList.add("ochiq");
  ochiqOyna = id;
  try { history.pushState({ oyna: id }, ""); } catch (e) {}
}
function oynaYop() {
  if (!ochiqOyna) return;
  $(ochiqOyna).classList.remove("ochiq");
  ochiqOyna = null;
}
function orqaga() {
  if (!ochiqOyna) return;
  if (history.state && history.state.oyna) history.back(); else oynaYop();
}
window.addEventListener("popstate", oynaYop);
document.querySelectorAll(".orqaga").forEach((b) => { b.onclick = orqaga; });
$("sozFon").onclick = orqaga;

// ---------- Tarix ----------
let tarix = [];
try { tarix = JSON.parse(oqi("axiom_tarix") || "[]"); } catch (e) { tarix = []; }
function tarixgaQo_sh(savol, javob) {
  tarix = tarix.filter((t) => t.s !== savol);
  tarix.unshift({ s: savol, j: javob });
  tarix = tarix.slice(0, 60);
  saqla("axiom_tarix", JSON.stringify(tarix));
}
function tarixChiz() {
  const ich = $("tarixIchki"); ich.innerHTML = "";
  if (!tarix.length) { const d = document.createElement("div"); d.className = "bosh"; d.textContent = "Hali yechilgan misol yo'q."; ich.appendChild(d); return; }
  tarix.forEach((t) => {
    const b = document.createElement("button"); b.className = "tarix-el";
    const s1 = document.createElement("b"); s1.textContent = t.s;
    const s2 = document.createElement("span"); s2.textContent = t.j;
    b.appendChild(s1); b.appendChild(s2);
    b.onclick = () => { orqaga(); kirish.value = t.s; setTimeout(() => kirish.focus(), 60); };
    ich.appendChild(b);
  });
}
$("tarix").onclick = () => { tarixChiz(); oynaOch("tarixOyna"); };
$("tarixTozala").onclick = () => { tarix = []; saqla("axiom_tarix", "[]"); tarixChiz(); };

// ---------- Ma'lumot ----------
let malumotMatni = null;
const ORNATISH = [
  ["Telefonga o'rnatish\n", "b"],
  ["Android (Chrome): ", "b"], ["Sozlamalardagi \"Ilovani o'rnatish\" tugmasi yoki menyu (⋮) → \"Ilovani o'rnatish\".\n", "n"],
  ["iPhone (Safari): ", "b"], ["Ulashish tugmasi → \"Bosh ekranga qo'shish\".\n\n", "n"],
  ["Internetsiz ishlashi\n", "b"],
  ["Birinchi ochilishda kerakli fayllar (taxminan 30–40 MB) yuklab olinadi. Shundan keyin Axiom internetsiz, hatto samolyot rejimida ham ishlaydi.\n\n", "n"],
  ["Maslahat\n", "b"],
  ["Pastdagi belgilar qatori (^ ( ) / * ...) telefon klaviaturasida yo'q belgilarni kiritish uchun. Amallar tugmasi (▦) tayyor namunalarni ochadi va yopadi.\n", "n"]
];
function malumotChiz(nom) {
  document.querySelectorAll("#malumot .tab").forEach((t) => t.classList.toggle("faol", t.dataset.tab === nom));
  const ich = $("ichki"); ich.innerHTML = "";
  const royxat = nom === "ornatish" ? ORNATISH : (malumotMatni ? malumotMatni[nom] : [["Yuklanmoqda…", "n"]]);
  royxat.forEach(([matn, tag]) => { const s = document.createElement("span"); s.className = tag; s.textContent = matn; ich.appendChild(s); });
  ich.scrollTop = 0;
}
async function malumotOch() {
  oynaOch("malumot");
  malumotChiz("qollanma");
  if (!malumotMatni && tayyor) {
    try { malumotMatni = JSON.parse(await hisobla("malumot", {})); malumotChiz("qollanma"); } catch (e) {}
  }
}
$("info").onclick = malumotOch;
document.querySelectorAll("#malumot .tab").forEach((t) => { t.onclick = () => malumotChiz(t.dataset.tab); });

// ---------- Sozlamalar oynasi ----------
$("sozBtn").onclick = () => oynaOch("sozOyna");

let ornatishSoraydi = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); ornatishSoraydi = e; });
window.addEventListener("appinstalled", () => { ornatishSoraydi = null; toast("Ilova o'rnatildi"); });
const standalone = () => (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
$("sOrnat").onclick = async () => {
  if (standalone()) { toast("Ilova allaqachon o'rnatilgan"); return; }
  if (ornatishSoraydi) {
    ornatishSoraydi.prompt();
    try { await ornatishSoraydi.userChoice; } catch (e) {}
    ornatishSoraydi = null;
    return;
  }
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) toast("Ulashish tugmasi → \"Bosh ekranga qo'shish\" ni bosing");
  else toast("Brauzer menyusidan (⋮) \"Ilovani o'rnatish\" ni tanlang");
};
$("sUlash").onclick = async () => {
  const url = location.href.split("#")[0];
  const malumot = { title: "Axiom AI", text: "Axiom AI — internetsiz ishlaydigan matematik yordamchi", url };
  if (navigator.share) { try { await navigator.share(malumot); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(url); toast("Havola nusxalandi"); } catch (e) { toast(url); }
};
let tozalaTaymer = null;
$("sTozala").onclick = () => {
  const b = $("sTozala");
  if (b.classList.contains("tasdiq")) {
    clearTimeout(tozalaTaymer);
    b.classList.remove("tasdiq"); b.textContent = "Chatni tozalash";
    chat.innerHTML = "";
    orqaga();
    toast("Chat tozalandi");
  } else {
    b.classList.add("tasdiq"); b.textContent = "Aniqmi? Tozalash uchun yana bosing";
    tozalaTaymer = setTimeout(() => { b.classList.remove("tasdiq"); b.textContent = "Chatni tozalash"; }, 4000);
  }
};

// ---------- Yangilanish xabari (versiya raqami ko'rsatilmaydi) ----------
function yangilanishXabari() { $("yangi").classList.add("korinadi"); pastgaKech(); }
$("yangilaBtn").onclick = () => location.reload();
$("yangiYop").onclick = () => $("yangi").classList.remove("korinadi");

// ---------- Ishga tushirish ----------
async function swTayyorla() {
  if (!("serviceWorker" in navigator)) return;
  try {
    let oldingi = navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (oldingi) yangilanishXabari();
      oldingi = navigator.serviceWorker.controller;
    });
    const reg = await navigator.serviceWorker.register("sw.js");
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await new Promise((r) => { navigator.serviceWorker.addEventListener("controllerchange", r, { once: true }); setTimeout(r, 3000); });
    }
  } catch (e) { /* xizmat oqimisiz ham ishlayveradi (faqat internetsiz emas) */ }
}
(async () => { await swTayyorla(); ishchiniBoshla(); })();
